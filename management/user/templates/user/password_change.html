{% extends "base.html" %}
{% block title %}Parola Değiştir{% endblock %}
{% block page_title %}Parola değiştir{% endblock %}
{% block page_sub %}Hesabınızın parolasını güncelleyin{% endblock %}

{% block content %}
<div class="card" style="max-width:520px">
  <form method="post" class="card-body" novalidate>
    {% csrf_token %}
    {% include "partials/_form.html" %}
    <div style="display:flex;gap:10px">
      <button class="btn primary" type="submit">Parolayı güncelle</button>
      <a class="btn" href="{% url 'user:profile' %}">Vazgeç</a>
    </div>
  </form>
</div>
{% endblock %}
