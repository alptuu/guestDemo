{% if page.has_other_pages %}
<div class="pagination">
  <span class="muted small">{{ page.start_index }}–{{ page.end_index }} / {{ page.paginator.count }}</span>
  <div class="pages">
    {% if page.has_previous %}<a class="btn sm" href="?{% querystring page=page.previous_page_number %}">Önceki</a>{% endif %}
    <span class="btn sm" style="pointer-events:none">{{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn sm" href="?{% querystring page=page.next_page_number %}">Sonraki</a>{% endif %}
  </div>
</div>
{% endif %}
